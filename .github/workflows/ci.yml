name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_hygiene.py
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install and smoke built wheel outside the checkout
        shell: bash
        run: |
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv "$RUNNER_TEMP/esscher-smoke"
          "$RUNNER_TEMP/esscher-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          test "$(esscher-smoke/bin/esscher --version)" = "esscher $expected_version"
          esscher-smoke/bin/esscher evaluate \
            --input "$GITHUB_WORKSPACE/tests/fixtures/synthetic_contract_panel.json" \
            --output "$RUNNER_TEMP/esscher-smoke/report.json"
          esscher-smoke/bin/python -c 'import json, pathlib; report=json.loads(pathlib.Path("esscher-smoke/report.json").read_text()); assert report["mode"] == "OFFLINE_RESEARCH"; assert report["event_count"] == 4'
          esscher-smoke/bin/esscher render-judge-trace \
            --output "$RUNNER_TEMP/esscher-smoke/esscher-evidence-trace.html"
          esscher-smoke/bin/python -c 'import pathlib; page=pathlib.Path("esscher-smoke/esscher-evidence-trace.html").read_text(); assert page.startswith("<!doctype html>"); assert "ACCEPTED_TERMINAL_FLAT" in page; assert "MANUAL_RECONCILIATION" in page; assert "STATIC · READ-ONLY · NO NETWORK" in page'
